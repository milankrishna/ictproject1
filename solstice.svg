<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark night sky gradient -->
  <defs>
    <radialGradient id="solsticeGradient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFE55C;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0.3" />
    </radialGradient>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1E3D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A2F5A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D1B4E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Night sky background -->
  <rect width="400" height="300" fill="url(#nightSky)"/>
  
  <!-- Stars -->
  <circle cx="50" cy="40" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="100" cy="30" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="150" cy="50" r="1.2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="200" cy="25" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="280" cy="35" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="350" cy="45" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="380" cy="20" r="1.3" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="70" cy="80" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="320" cy="70" r="1.2" fill="#FFFFFF" opacity="0.7"/>
  
  <!-- Solstice sun/glow -->
  <circle cx="200" cy="80" r="45" fill="url(#solsticeGradient)"/>
  <circle cx="200" cy="80" r="40" fill="#FFD700" opacity="0.6"/>
  
  <!-- Sun rays -->
  <line x1="200" y1="25" x2="200" y2="5" stroke="#FFE55C" stroke-width="2" opacity="0.7"/>
  <line x1="200" y1="135" x2="200" y2="155" stroke="#FFE55C" stroke-width="2" opacity="0.7"/>
  <line x1="145" y1="80" x2="125" y2="80" stroke="#FFE55C" stroke-width="2" opacity="0.7"/>
  <line x1="255" y1="80" x2="275" y2="80" stroke="#FFE55C" stroke-width="2" opacity="0.7"/>
  <line x1="152" y1="32" x2="138" y2="18" stroke="#FFE55C" stroke-width="1.5" opacity="0.6"/>
  <line x1="248" y1="128" x2="262" y2="142" stroke="#FFE55C" stroke-width="1.5" opacity="0.6"/>
  <line x1="248" y1="32" x2="262" y2="18" stroke="#FFE55C" stroke-width="1.5" opacity="0.6"/>
  <line x1="152" y1="128" x2="138" y2="142" stroke="#FFE55C" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Landscape silhouettes -->
  <!-- Mountains -->
  <polygon points="0,200 80,120 160,180 240,100 320,170 400,140 400,300 0,300" fill="#1A0F2E" opacity="0.9"/>
  
  <!-- Foreground trees silhouette -->
  <g opacity="0.8">
    <!-- Left tree -->
    <polygon points="30,200 20,150 10,200" fill="#0B0820"/>
    <polygon points="50,210 40,170 30,210" fill="#0B0820"/>
    
    <!-- Center trees -->
    <polygon points="180,200 170,140 160,200" fill="#0B0820"/>
    <polygon points="220,205 210,155 200,205" fill="#0B0820"/>
    
    <!-- Right trees -->
    <polygon points="340,200 330,160 320,200" fill="#0B0820"/>
    <polygon points="370,210 360,170 350,210" fill="#0B0820"/>
  </g>
  
  <!-- Glow effect around sun -->
  <circle cx="200" cy="80" r="55" fill="none" stroke="#FF8C00" stroke-width="8" opacity="0.2"/>
  <circle cx="200" cy="80" r="65" fill="none" stroke="#FFD700" stroke-width="6" opacity="0.1"/>
  
  <!-- Title text -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFE55C">Solstice Glow</text>
</svg>