<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background sky -->
  <rect width="400" height="300" fill="url(#skyGradient)"/>
  
  <!-- Sun -->
  <circle cx="350" cy="50" r="30" fill="#FFD700" opacity="0.9"/>
  
  <!-- River water -->
  <path d="M 0 180 Q 100 160, 200 175 T 400 180 L 400 300 L 0 300 Z" fill="url(#waterGradient)"/>
  
  <!-- River flow waves -->
  <path d="M 0 185 Q 50 175, 100 185 T 200 185 T 300 185 T 400 185" stroke="#6BB6D6" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 0 200 Q 50 190, 100 200 T 200 200 T 300 200 T 400 200" stroke="#5AA5C5" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Riverbanks - left side -->
  <path d="M 0 180 Q 50 200, 100 190 Q 150 180, 200 175 L 200 300 L 0 300 Z" fill="#8B7355" opacity="0.7"/>
  
  <!-- Riverbanks - right side -->
  <path d="M 200 175 Q 250 180, 300 190 Q 350 200, 400 180 L 400 300 L 200 300 Z" fill="#A0826D" opacity="0.7"/>
  
  <!-- Trees on left bank -->
  <g opacity="0.8">
    <rect x="30" y="240" width="8" height="50" fill="#654321"/>
    <circle cx="34" cy="230" r="25" fill="#228B22"/>
    
    <rect x="90" y="255" width="8" height="35" fill="#654321"/>
    <circle cx="94" cy="245" r="20" fill="#2E8B57"/>
  </g>
  
  <!-- Trees on right bank -->
  <g opacity="0.8">
    <rect x="320" y="245" width="8" height="45" fill="#654321"/>
    <circle cx="324" cy="235" r="23" fill="#228B22"/>
    
    <rect x="360" y="250" width="8" height="40" fill="#654321"/>
    <circle cx="364" cy="240" r="22" fill="#2E8B57"/>
  </g>
  
  <!-- Water reflections -->
  <ellipse cx="200" cy="220" rx="60" ry="15" fill="#FFFFFF" opacity="0.15"/>
  <ellipse cx="100" cy="250" rx="40" ry="10" fill="#FFFFFF" opacity="0.1"/>
  <ellipse cx="300" cy="240" rx="50" ry="12" fill="#FFFFFF" opacity="0.1"/>
  
  <!-- Title text -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">River Flow</text>
</svg>