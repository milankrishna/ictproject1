<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="gallery.html">Art Gallery</a>
        <div class="ms-auto">
          <a class="nav-link d-inline-block me-3" href="gallery.html">Home</a>
          <a class="nav-link d-inline-block" href="index.html">Logout</a>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <h1 class="h3 mb-4">Available Art Pieces</h1>
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card p-3">
            <img src="./assets/river.svg" class="art-image rounded" alt="River artwork" />
            <div class="card-body">
              <h5 class="card-title">River Flow</h5>
              <p class="card-text">Artist: Lina Soto</p>
              <a href="art4.html" class="btn btn-primary">Open Page</a>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card p-3">
            <img src="./assets/solstice.svg" class="art-image rounded" alt="Solstice artwork" />
            <div class="card-body">
              <h5 class="card-title">Solstice Glow</h5>
              <p class="card-text">Artist: Mira Cole</p>
              <a href="art5.html" class="btn btn-primary">Open Page</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
