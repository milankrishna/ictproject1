<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container py-5 page-shell">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card p-4 p-lg-5">
            <h1 class="h3 mb-3">Create Your Account</h1>
            <p class="text-muted">This page is intentionally simple for a beginner project.</p>
            <form>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">First Name</label>
                  <input type="text" class="form-control" placeholder="First name" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Last Name</label>
                  <input type="text" class="form-control" placeholder="Last name" />
                </div>
                <div class="col-12">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" placeholder="you@example.com" />
                </div>
                <div class="col-12">
                  <label class="form-label">Password</label>
                  <input type="password" class="form-control" placeholder="Choose a password" />
                </div>
              </div>
              <button type="submit" class="btn btn-primary mt-4">Sign Up</button>
              <a href="index.html" class="btn btn-outline-primary mt-4 ms-2">Back to Login</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
