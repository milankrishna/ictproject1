<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Gallery Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container py-5 page-shell">
      <div class="row justify-content-center align-items-center">
        <div class="col-lg-5">
          <div class="hero p-4 p-lg-5">
            <h1 class="display-6 fw-bold mb-3">Welcome to the Art Gallery</h1>
            <p class="lead">A simple gallery experience for browsing creative pieces.</p>
            <a href="gallery.html" class="btn btn-primary btn-lg">Open Gallery</a>
            <a href="signup.html" class="btn btn-outline-primary btn-lg ms-2">Create Account</a>
          </div>
        </div>
        <div class="col-lg-4 mt-4 mt-lg-0">
          <div class="card p-4">
            <h2 class="h4 mb-3">Login</h2>
            <form>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="you@example.com" />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Enter password" />
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <p class="mt-3 mb-0 text-center">
              New here? <a href="signup.html">Sign up</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
